# For Ubuntu-specific instructions
---
- name: Install NGINX Open Source from official nginx.org repo (Ubuntu)
  # hosts: nginx_apt_stable
  hosts: nginx_apt_mainline
  become: true
  gather_facts: true

  vars:
    # Choose: "stable" or "mainline"
    # nginx_channel: "stable"
    nginx_channel: "mainline"

    nginx_key_url: "https://nginx.org/keys/nginx_signing.key"
    nginx_keyring_path: "/usr/share/keyrings/nginx-archive-keyring.gpg"
    nginx_list_path: "/etc/apt/sources.list.d/nginx.list"
    nginx_pin_path: "/etc/apt/preferences.d/99nginx"
    nginx_fingerprint: "573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62"

    # Additional packages you want installed together
    extra_packages:
      - curl
      - jq
      - htop

    env_file: ".env.label_group"

  tasks:

    - name: Update and upgrade repository index
      ansible.builtin.apt:
      # apt:
        update_cache: yes
        cache_valid_time: 3600
        upgrade: dist

    - name: Install prerequisites for nginx.org repo
      ansible.builtin.apt:
        name:
          - curl
          - gnupg2
          - ca-certificates
          - lsb-release
          - ubuntu-keyring
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Download NGINX signing key (ascii)
      ansible.builtin.get_url:
        url: "{{ nginx_key_url }}"
        dest: "/tmp/nginx_signing.key"
        mode: "0644"

    - name: Convert signing key to GPG keyring (dearmor)
      ansible.builtin.command: >
        gpg --dearmor -o {{ nginx_keyring_path }} /tmp/nginx_signing.key
      args:
        creates: "{{ nginx_keyring_path }}"

    - name: Verify NGINX signing key fingerprint (recommended)
      ansible.builtin.command: >
        gpg --dry-run --quiet --no-keyring --import --import-options import-show {{ nginx_keyring_path }}
      register: nginx_key_check
      changed_when: false

    - name: Fail if fingerprint does not match expected NGINX key
      ansible.builtin.assert:
        that:
          - nginx_fingerprint in nginx_key_check.stdout
        fail_msg: "NGINX repo key fingerprint mismatch. Refusing to add repo."

    - name: Add nginx.org apt repository (stable or mainline)
      ansible.builtin.copy:
        dest: "{{ nginx_list_path }}"
        mode: "0644"
        content: |
          deb [signed-by={{ nginx_keyring_path }}] https://nginx.org/packages{% if nginx_channel == 'mainline' %}/mainline{% endif %}/ubuntu {{ ansible_facts.lsb.codename | default(ansible_facts.distribution_release) }} nginx

    - name: Prefer nginx.org packages over Ubuntu repo (pinning)
      ansible.builtin.copy:
        dest: "{{ nginx_pin_path }}"
        mode: "0644"
        content: |
          Package: *
          Pin: origin nginx.org
          Pin: release o=nginx
          Pin-Priority: 900

    - name: Update apt cache after adding nginx.org repo
      ansible.builtin.apt:
        update_cache: yes

    - name: remove old NGINX if does exits
      ansible.builtin.apt:
        name: nginx
        state: absent

    - name: Install NGINX + extra packages
      ansible.builtin.apt:
        name: "{{ ['nginx'] + extra_packages }}"
        state: latest

    - name: Ensure nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Load DATA_PLANE_KEY from .env on control node
      ansible.builtin.set_fact:
        data_plane_key: >-
          {{ lookup('file', '.env')
            | regex_replace('(?m)^DATA_PLANE_KEY=(.*)$', '\1')
            | trim }}
      delegate_to: localhost
      # run_once: true

    - name: Ensure DATA_PLANE_KEY is set
      ansible.builtin.assert:
        that:
          - data_plane_key is defined
          - data_plane_key | length > 0
        fail_msg: "DATA_PLANE_KEY not found in .env"

    - name: Register NGINX instance (capture output)
      ansible.builtin.shell: |
        curl -fsSL https://agent.connect.nginx.com/nginx-agent/install | sh -s -- -y
      environment:
        DATA_PLANE_KEY: "{{ data_plane_key }}"
      args:
        executable: /bin/bash
      register: nginx_agent_install
      changed_when: false

    - name: Load label_group from .env.label_group on control node
      ansible.builtin.set_fact:
        label_group: >-
          {{ lookup('file', '.env.label_group')
            | regex_replace('(?m)^label_group=(.*)$', '\1')
            | trim }}
      delegate_to: localhost
      # run_once: true

    - name: Debug env_file and label_group
      ansible.builtin.debug:
        msg:
          - "env_file={{ env_file }}"
          - "label_group='{{ label_group }}'"
      delegate_to: localhost
      # run_once: true

    - name: Ensure label_group is set
      ansible.builtin.assert:
        that:
          - label_group | length > 0
        fail_msg: "label_group not found in {{ env_file }}"

    - name: Ensure yq is installed (Debian/Ubuntu)
      ansible.builtin.apt:
        name: yq
        state: present
        update_cache: true
      when: ansible_facts.os_family | default('') == "Debian"

    - name: Upsert labels.config-sync-group in nginx-agent.conf
      ansible.builtin.command:
        cmd: >
          yq -i '.labels = (.labels // {}) |
                 .labels."config-sync-group" = "{{ label_group }}"'
          /etc/nginx-agent/nginx-agent.conf -y
      register: yq_update
      changed_when: yq_update.rc == 0

    - name: Restart nginx-agent if config changed
      ansible.builtin.service:
        name: nginx-agent
        state: restarted
      when: yq_update is changed